<!-- 🔥 ONLY SCRIPT SECTION UPDATED – EVERYTHING ELSE SAME -->
<script>
    let _supabase, signaturePad;
    const canvas = document.getElementById('signature-pad');

    const SUPABASE_URL = 'https://xjzaugpmhbkwmzbnhlqu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_OfYMNmWo_zRmLW056PrpYA_Fga9sjcy';

    window.onload = function() {
        try {
            _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            signaturePad = new SignaturePad(canvas, { 
                backgroundColor: 'rgb(255, 255, 255)', 
                penColor: 'rgb(10, 37, 64)',
                minWidth: 1.5,
                maxWidth: 4.5
            });
        } catch (e) { console.error("Init Error:", e); }
    };

    function resizeCanvas() {
        if (!canvas || !signaturePad) return;
        const ratio = Math.max(window.devicePixelRatio || 1, 1);
        const wrapper = canvas.parentElement;
        canvas.width = wrapper.offsetWidth * ratio; 
        canvas.height = wrapper.offsetHeight * ratio;
        const context = canvas.getContext("2d");
        context.scale(ratio, ratio);
        signaturePad.clear();
    }

    window.addEventListener("resize", resizeCanvas);

    /* =========================
       🔥 PRO LEAD ENGINE
    ========================= */

    function calculateLeadScore(dynamicData) {
        let score = 0;

        Object.values(dynamicData).forEach(val => {
            if (val === "Yes") score += 10;
            if (val === "Unsure") score += 3;
        });

        if (document.getElementById('pathology').value.length > 20) score += 25;
        if (document.getElementById('phone').value) score += 10;
        if (document.getElementById('email').value) score += 10;

        return score;
    }

    function getLeadTier(score) {
        if (score >= 80) return "PREMIUM";
        if (score >= 50) return "MEDIUM";
        return "LOW";
    }

    function checkAttorneyConflict(dynamicData) {
        return Object.keys(dynamicData).some(key => 
            key.toLowerCase().includes("attorney") && dynamicData[key] === "Yes"
        );
    }

    function hasStrongCase(dynamicData) {
        let yesCount = 0;
        Object.values(dynamicData).forEach(v => {
            if (v === "Yes") yesCount++;
        });
        return yesCount >= 3;
    }

    function generateDynamicQuestions() {
        const selectedType = document.getElementById('case_type').value;
        const container = document.getElementById('dynamic-questions-container');
        if (!container) return;
        container.innerHTML = "";

        if (litigationQuestions[selectedType]) {
            litigationQuestions[selectedType].forEach(item => {
                const wrapper = document.createElement('div');
                wrapper.className = "niche-question-block";
                wrapper.innerHTML = `
                    <label class="niche-label">${item.q}</label>
                    <select class="dynamic-answer" data-qid="${item.id}" data-qtext="${item.q}">
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                        <option value="Unsure">Unsure</option>
                    </select>`;
                container.appendChild(wrapper);
            });
            return true;
        }
        return false;
    }

    function validateAndNext(current, target) {
        if (current === 1) {
            if (!document.getElementById('first_name').value || !document.getElementById('consent_checkbox').checked) {
                alert("Please complete required fields and consent."); 
                return;
            }
        }

        if (current === 2) {
            if (!document.getElementById('case_type').value) { 
                alert("Please select a Case Category."); 
                return; 
            }
            generateDynamicQuestions();
        }

        next(target);
    }

    function next(s) {
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById('step' + s).classList.add('active');
        document.getElementById('fill').style.width = (s * 25) + '%';
        window.scrollTo(0,0);

        if (s === 4) {
            setTimeout(resizeCanvas, 150);
        }
    }

    async function submit() {
        if (signaturePad.isEmpty()) { 
            alert("Digital Signature Required."); 
            return; 
        }

        const btn = document.getElementById('submit-btn');
        btn.innerText = "Securing Audit Data..."; 
        btn.disabled = true;

        const dynamicData = {};
        document.querySelectorAll('.dynamic-answer').forEach(el => {
            dynamicData[el.getAttribute('data-qtext')] = el.value;
        });

        /* 🔥 INTELLIGENCE LAYER */
        const lead_score = calculateLeadScore(dynamicData);
        const lead_tier = getLeadTier(lead_score);
        const has_attorney = checkAttorneyConflict(dynamicData);
        const strong_case = hasStrongCase(dynamicData);

        const payload = {
            first_name: document.getElementById('first_name').value,
            last_name: document.getElementById('last_name').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            zip_code: document.getElementById('zip_code').value,
            case_type: document.getElementById('case_type').value,

            audit_metadata: dynamicData,
            pathology_impression: document.getElementById('pathology').value,
            signature_base64: signaturePad.toDataURL(),

            /* 🔥 NEW FIELDS */
            lead_score: lead_score,
            lead_tier: lead_tier,
            attorney_conflict: has_attorney,
            strong_case_signal: strong_case,
            response_ready: true,

            apollo_form_id: document.getElementById('apollo_form_id').value,
            submitted_at: new Date().toISOString()
        };

        try {
            const { error } = await _supabase
                .from('settlement_assets')
                .insert([payload]);

            if (error) throw error;

            if (lead_tier === "PREMIUM") {
                alert("✅ HIGH VALUE CASE RECEIVED.");
            } else if (lead_tier === "MEDIUM") {
                alert("✅ CASE RECEIVED.");
            } else {
                alert("Submission received.");
            }

            location.reload();

        } catch (err) {
            alert("Submission Error: " + err.message); 
            btn.disabled = false; 
            btn.innerText = "Submit Final Audit";
        }
    }
</script>
