<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NextGen Leadlogic | Universal Settlement Audit</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <style>
        :root { --primary: #0a2540; --accent: #00d4ff; --text: #424770; }
        body { font-family: 'Inter', sans-serif; background: #f6f9fc; display: flex; justify-content: center; padding: 40px 20px; color: var(--text); }
        #audit-container { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 50px 100px -20px rgba(50,50,93,0.25); max-width: 650px; width: 100%; border-top: 10px solid var(--primary); }
        .step { display: none; }
        .step.active { display: block; }
        .progress-bar { height: 6px; background: #e6ebf1; margin-bottom: 30px; border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent); width: 25%; transition: 0.4s; }
        
        /* Signature Area Fixes */
        .signature-wrapper {
            position: relative;
            width: 100%;
            height: 200px;
            background-color: #fff;
            border: 2px dashed #cbd5e0;
            border-radius: 8px;
            margin-bottom: 10px;
            touch-action: none; /* Critical for mobile */
        }
        #signature-pad {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }
        
        h2 { color: var(--primary); font-size: 22px; margin-bottom: 5px; }
        label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 11px; text-transform: uppercase; color: #8898aa; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #e6ebf1; border-radius: 4px; font-size: 16px; margin-bottom: 20px; box-sizing: border-box; }
        .btn-row { display: flex; justify-content: space-between; margin-top: 20px; }
        button { padding: 15px 30px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-next { background: var(--primary); color: white; width: 100%; }
        .btn-back { background: #e6ebf1; color: var(--text); padding: 15px 20px; }
        .compliance-text { font-size: 11px; color: #6b7c93; line-height: 1.6; margin-top: 15px; }
    </style>
</head>
<body>

<div id="audit-container">
    <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>

    <!-- STEP 1-3 (Keep your existing content here) -->
    <div class="step active" id="step1">
        <h2>Claimant Verification</h2>
        <input type="text" id="first_name" placeholder="First Name">
        <input type="text" id="last_name" placeholder="Last Name">
        <button class="btn-next" onclick="next(2)">Continue</button>
    </div>

    <div class="step" id="step2">
        <h2>Case Selection</h2>
        <select id="case_type">
            <option value="OZEMPIC">Ozempic/GLP-1</option>
            <option value="TALCUM">Talcum Powder</option>
        </select>
        <button class="btn-next" onclick="next(3)">Continue</button>
    </div>

    <div class="step" id="step3">
        <h2>Details</h2>
        <textarea id="pathology" placeholder="Details..."></textarea>
        <button class="btn-next" onclick="next(4)">Final Step</button>
    </div>

    <!-- STEP 4: THE FIX IS HERE -->
    <div class="step" id="step4">
        <h2>Legal Execution</h2>
        <p>Please sign inside the box below:</p>
        
        <div class="signature-wrapper">
            <canvas id="signature-pad"></canvas>
        </div>

        <button type="button" onclick="clearSig()" style="background:none; color:red; font-size:12px; padding:5px; border:1px solid red; margin-bottom:10px;">Clear Signature</button>
        
        <div class="compliance-text">
            I certify that the information provided is true and accurate.
        </div>
        
        <div class="btn-row">
            <button class="btn-back" onclick="next(3)">Back</button>
            <button class="btn-next" id="submit-btn" style="width:70%; background:#00d4ff;" onclick="submit()">Submit Final Audit</button>
        </div>
    </div>
</div>

<script>
    let signaturePad;
    const canvas = document.getElementById('signature-pad');

    // Function to handle moving between steps
    function next(s) {
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById('step' + s).classList.add('active');
        document.getElementById('fill').style.width = (s * 25) + '%';
        
        // If we are on step 4, initialize the pad
        if (s === 4) {
            initSignaturePad();
        }
    }

    function initSignaturePad() {
        // We must set the internal canvas width to match the visual width
        const ratio = Math.max(window.devicePixelRatio || 1, 1);
        canvas.width = canvas.offsetWidth * ratio;
        canvas.height = canvas.offsetHeight * ratio;
        canvas.getContext("2d").scale(ratio, ratio);

        // Clear existing instance if any
        if (signaturePad) {
            signaturePad.off();
        }

        signaturePad = new SignaturePad(canvas, {
            backgroundColor: 'rgb(255, 255, 255)',
            penColor: 'rgb(0, 0, 0)'
        });
    }

    function clearSig() {
        if (signaturePad) signaturePad.clear();
    }

    async function submit() {
        if (!signaturePad || signaturePad.isEmpty()) {
            alert("Please provide a signature.");
            return;
        }
        
        const dataURL = signaturePad.toDataURL();
        console.log("Signature captured:", dataURL);
        alert("Form submitted successfully with signature!");
        // Your Supabase logic goes here
    }

    // Handle window resizing
    window.onresize = () => {
        if (document.getElementById('step4').classList.contains('active')) {
            initSignaturePad();
        }
    };
</script>
</body>
</html>
