<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextGen Leadlogic | Universal Settlement Audit</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <style>
        :root { --primary: #0a2540; --accent: #00d4ff; --text: #424770; --error: #ff4757; --tier1: #2ed573; --gold: #FFD700; --platinum: #E5E4E2; }
        body { font-family: 'Inter', sans-serif; background: #f6f9fc; display: flex; justify-content: center; padding: 40px 20px; color: var(--text); }
        #audit-container { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 50px 100px -20px rgba(50,50,93,0.25); max-width: 650px; width: 100%; border-top: 10px solid var(--primary); }
        .step { display: none; }
        .step.active { display: block; }
        .progress-bar { height: 6px; background: #e6ebf1; margin-bottom: 30px; border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent); width: 20%; transition: 0.4s; }
        h2 { color: var(--primary); font-size: 22px; margin-bottom: 5px; }
        label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 11px; text-transform: uppercase; color: #8898aa; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #e6ebf1; border-radius: 4px; font-size: 16px; margin-bottom: 20px; box-sizing: border-box; }
        .btn-row { display: flex; justify-content: space-between; margin-top: 20px; }
        button { padding: 15px 30px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-next { background: var(--primary); color: white; width: 100%; }
        .signature-wrapper { position: relative; width: 100%; height: 200px; border: 2px solid #0a2540; border-radius: 8px; background: #ffffff; touch-action: none; margin-bottom: 10px; }
        #signature-pad { position: absolute; left: 0; top: 0; width: 100%; height: 100%; cursor: crosshair; }
        .file-upload-zone { border: 2px dashed #e6ebf1; padding: 20px; text-align: center; border-radius: 8px; cursor: pointer; transition: 0.3s; margin-bottom: 20px; }
        .file-upload-zone:hover { border-color: var(--accent); background: #f0fbff; }
        .otp-block { display: none; background: #eefbff; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--accent); }
    </style>
</head>
<body>

<div id="audit-container">
    <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>

    <!-- STEP 1: VERIFICATION & OTP LAYER -->
    <div class="step active" id="step1">
        <h2>Claimant Verification</h2>
        <div style="display:flex; gap:10px;">
            <input type="text" id="first_name" placeholder="First Name" required>
            <input type="text" id="last_name" placeholder="Last Name" required>
        </div>
        <input type="email" id="email" placeholder="Email Address" required>
        <input type="tel" id="phone" placeholder="Phone Number" required>
        
        <div id="otp-area" class="otp-block">
            <label>Verification Code Sent</label>
            <input type="text" id="otp_code" placeholder="Enter 6-digit code">
            <button class="btn-next" style="background:var(--tier1)" onclick="verifyOTP()">Verify Identity</button>
        </div>

        <button id="otp-trigger" class="btn-next" onclick="sendOTP()">Request Verification Code</button>
        
        <label style="margin-top:20px;">Jurisdiction</label>
        <select id="jurisdiction">
            <option value="CA">California</option>
            <option value="TX">Texas</option>
            <option value="FL">Florida</option>
            <option value="NY">New York</option>
            <option value="OTHER">Other</option>
        </select>
    </div>

    <!-- STEP 2: DISCOVERY -->
    <div class="step" id="step2">
        <h2>Case Intelligence</h2>
        <label>Case Category</label>
        <select id="case_type">
            <option value="">-- Select --</option>
            <option value="HIP_REPLACEMENT">Orthopedic / Metallosis</option>
            <option value="ONCOLOGY">Toxic Exposure / Cancer</option>
            <option value="GLP1">Gastric / GLP-1</option>
        </select>
        <label>First Diagnosis Date</label>
        <input type="date" id="diagnosis_date" required>
        <button class="btn-next" onclick="validateSOL()">Next: Evidence Tiering</button>
    </div>

    <!-- STEP 3: FILE VALIDATION PIPELINE -->
    <div class="step" id="step3">
        <h2>Evidence Tier Audit</h2>
        <select id="evidence_tier" onchange="toggleUploadZone()">
            <option value="3">Tier 3: Self-Report</option>
            <option value="2">Tier 2: Prescriptions</option>
            <option value="1">Tier 1: Imaging + Pathology</option>
        </select>

        <div id="upload-zone" class="file-upload-zone" onclick="document.getElementById('evidence_file').click()">
            <strong id="upload-label">Click to Upload Medical Proof</strong>
            <p style="font-size: 10px;">PDF or JPG (Max 5MB)</p>
            <input type="file" id="evidence_file" style="display:none" onchange="handleFileValidation()">
            <div id="file-name-display" style="margin-top:10px; font-size:12px; color:var(--tier1);"></div>
        </div>

        <textarea id="pathology" rows="4" placeholder="Symptom timeline..."></textarea>
        <button class="btn-next" onclick="next(4)">Legal Review</button>
    </div>

    <!-- STEP 4: SIGNATURE & MARKETPLACE ROUTING -->
    <div class="step" id="step4">
        <h2>Legal Execution</h2>
        <div class="signature-wrapper"><canvas id="signature-pad"></canvas></div>
        <p class="compliance-text">Audit locked via SHA-256 Fingerprint. Submission implies exclusive routing authorization.</p>
        <button class="btn-next" id="submit-btn" style="background:var(--accent);" onclick="submitAudit()">Certify & Route Lead</button>
    </div>
</div>

<script>
    let _supabase, signaturePad;
    let startTime, uploadedFileBase64 = null;
    let isVerified = false;

    // 🟢 MARKETPLACE ROUTING ENGINE
    const MARKETPLACE_ROUTING = {
        PLATINUM: { endpoint: "https://api.marketplace.io/route/exclusive-premium", buyer: "Morgan & Morgan Elite" },
        GOLD: { endpoint: "https://api.marketplace.io/route/standard-bid", buyer: "Marketplace Round-Robin" },
        SILVER: { endpoint: "https://api.marketplace.io/route/bulk-storage", buyer: "Internal Backlog" }
    };

    const AUDIT_CONFIG = { model_version: "v3.0.0-final", rule_set: "exclusive-routing-2026" };
    const SUPABASE_URL = 'https://xjzaugpmhbkwmzbnhlqu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_OfYMNmWo_zRmLW056PrpYA_Fga9sjcy';

    window.onload = function() {
        _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        signaturePad = new SignaturePad(document.getElementById('signature-pad'));
    };

    function sendOTP() {
        if (!document.getElementById('email').value || !document.getElementById('phone').value) return alert("Contact data missing");
        document.getElementById('otp-area').style.display = 'block';
        document.getElementById('otp-trigger').style.display = 'none';
    }

    function verifyOTP() {
        if (document.getElementById('otp_code').value.length === 6) {
            isVerified = true;
            startTracking();
            next(2);
        } else { alert("Invalid Code"); }
    }

    function handleFileValidation() {
        const file = document.getElementById('evidence_file').files[0];
        const allowedTypes = ['application/pdf', 'image/jpeg', 'image/png'];
        const maxSize = 5 * 1024 * 1024;

        if (file.size > maxSize) return alert("File too large (>5MB)");
        if (!allowedTypes.includes(file.type)) return alert("Format not supported.");

        document.getElementById('file-name-display').innerText = "✓ Validated: " + file.name;
        const reader = new FileReader();
        reader.onload = (e) => { uploadedFileBase64 = e.target.result; };
        reader.readAsDataURL(file);
    }

    async function createFingerprint(email, phone) {
        const msgBuffer = new TextEncoder().encode(email.toLowerCase() + phone.replace(/\D/g, ''));
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function startTracking() { startTime = Date.now(); }
    function next(s) {
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById('step' + s).classList.add('active');
        document.getElementById('fill').style.width = (s * 25) + '%';
    }

    function validateSOL() { next(3); }
    function toggleUploadZone() { document.getElementById('upload-zone').style.opacity = (document.getElementById('evidence_tier').value === "3") ? "0.5" : "1"; }

    async function submitAudit() {
        const email = document.getElementById('email').value;
        const phone = document.getElementById('phone').value;
        const fingerprint = await createFingerprint(email, phone);
        const tier = document.getElementById('evidence_tier').value;
        
        let leadTier = (tier === "1" && uploadedFileBase64) ? "PLATINUM" : (tier === "2" ? "GOLD" : "SILVER");
        const route = MARKETPLACE_ROUTING[leadTier];

        const payload = {
            lead_id: fingerprint,
            monetization_tier: leadTier,
            buyer_lock: route.buyer,
            evidence_blob: uploadedFileBase64,
            is_exclusive: true,
            audit_metadata: { ...AUDIT_CONFIG, scored_at: new Date().toISOString() }
        };

        const { error } = await _supabase.from('settlement_assets').insert([payload]);
        
        if (error && error.code === '23505') {
            alert("Duplicate Claim Detected. Lead already routed.");
        } else if (!error) {
            fetch(route.endpoint, { method: 'POST', body: JSON.stringify(payload) });
            alert(`SUCCESS: Lead Locked & Routed to ${route.buyer}.`);
            location.reload();
        }
    }
</script>
</body>
</html>
