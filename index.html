<script>
    let _supabase, signaturePad;
    const canvas = document.getElementById('signature-pad');

    const SUPABASE_URL = 'https://xjzaugpmhbkwmzbnhlqu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_OfYMNmWo_zRmLW056PrpYA_Fga9sjcy';

    window.onload = function() {
        try {
            _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            signaturePad = new SignaturePad(canvas, { 
                backgroundColor: 'rgb(255, 255, 255)', 
                penColor: 'rgb(10, 37, 64)',
                minWidth: 1.5,
                maxWidth: 4.5
            });
        } catch (e) { console.error("Init Error:", e); }
    };

    function resizeCanvas() {
        if (!canvas || !signaturePad) return;
        const ratio = Math.max(window.devicePixelRatio || 1, 1);
        const wrapper = canvas.parentElement;
        canvas.width = wrapper.offsetWidth * ratio; 
        canvas.height = wrapper.offsetHeight * ratio;
        const context = canvas.getContext("2d");
        context.scale(ratio, ratio);
        signaturePad.clear();
    }

    window.addEventListener("resize", resizeCanvas); 

    // UPDATED UNIVERSAL QUESTIONS: High-Value & Contact Optimization
    const universalQualifiers = [
        { id: 'univ_1', q: 'Are you filing for yourself or someone else?', type: 'select', options: ['Myself', 'Someone Else'] },
        { id: 'univ_2', q: 'Is the injured person deceased?', type: 'select', options: ['No', 'Yes'] },
        { id: 'univ_diagn', q: 'Was diagnosis confirmed by a specialist?', type: 'select', options: ['Yes', 'No', 'Unsure'] },
        { id: 'univ_disab', q: 'Permanent disability rating?', type: 'select', options: ['NONE', 'Partial', 'Total'] },
        { id: 'univ_3', q: 'Has this condition affected your ability to work?', type: 'select', options: ['No', 'Yes'] },
        { id: 'univ_future', q: 'Estimated future medical costs (lifetime care)?', type: 'text', placeholder: 'e.g. $50,000+' },
        { id: 'univ_contact', q: 'Preferred contact time window?', type: 'select', options: ['Morning', 'Afternoon', 'Evening'] },
        { id: 'univ_unknown', q: 'Do you answer calls from unknown numbers?', type: 'select', options: ['Yes', 'No'] },
        { id: 'univ_7', q: 'Do you have medical records available?', type: 'select', options: ['Yes', 'No'] },
        { id: 'univ_9', q: 'Can we call you immediately today?', type: 'select', options: ['Yes', 'No'] }
    ];

    // UPDATED LITIGATION QUESTIONS: Defense-Proofing Added
    const litigationQuestions = {
        'DJI': [
            { id: 'dji_p1', q: 'Implant Brand: What brand was the implant? (if known)', type: 'text' },
            { id: 'dji_p4', q: 'Diagnosis: Were you diagnosed with a DJI within 2 years of surgery?', type: 'select', options: ['Yes', 'No', 'Unsure'] },
            { id: 'dji_p5', q: 'Procedural History: Did you require a revision surgery or "washout"?', type: 'select', options: ['Yes', 'No', 'Unsure'] },
            { id: 'dji_warn', q: 'Did a doctor warn you of infection risks?', type: 'select', options: ['Yes', 'No'] }
        ],
        'FRESENIUS': [
            { id: 'fr_p1', q: 'Clinic Name: Name of dialysis center', type: 'text' },
            { id: 'fr_p3', q: 'Temporal Link: Did a cardiac event occur within 48 hours of dialysis?', type: 'select', options: ['Yes', 'No'] },
            { id: 'fr_recall', q: 'Were you aware of GranuFlo/NaturaLyte recalls?', type: 'select', options: ['Yes', 'No'] }
        ],
        'OZEMPIC': [
            { id: 'glp_p1', q: 'Was the product prescribed by a doctor or self-used?', type: 'select', options: ['Prescribed', 'Self-Used'] },
            { id: 'glp_p3', q: 'Diagnosis: Have you been diagnosed with Gastroparesis or Ileus?', type: 'select', options: ['Yes', 'No'] },
            { id: 'glp_report', q: 'Did you report symptoms to a doctor early?', type: 'select', options: ['Yes', 'No'] }
        ],
        'TALCUM': [
            { id: 'tlc_p1', q: 'Brand Identification: Which brand did you use (e.g. J&J)?', type: 'text' },
            { id: 'tlc_p3', q: 'Diagnosis: Confirmed Ovarian Cancer or Mesothelioma?', type: 'select', options: ['Yes', 'No'] },
            { id: 'tlc_lawsuit', q: 'Have you participated in previous class actions for this?', type: 'select', options: ['No', 'Yes'] }
        ],
        'DEPO_PROVERA': [
            { id: 'dp_p3', q: 'Diagnosis: Confirmed Meningioma (brain tumor)?', type: 'select', options: ['Yes', 'No'] },
            { id: 'dp_timeline', q: 'Time gap between first injection and symptoms?', type: 'text', placeholder: 'e.g. 5 years' }
        ],
        'NURSING_HOME': [
            { id: 'nh_p1', q: 'Facility Name: Name of nursing home facility', type: 'text' },
            { id: 'nh_p3', q: 'Injury: Pressure sore, fracture, or sepsis?', type: 'select', options: ['Yes', 'No'] }
        ],
        'TOXIC_EXPOSURE': [
            { id: 'pfas_p2', q: 'Source: Source of exposure (water system, employer, base)', type: 'text' },
            { id: 'pfas_p3', q: 'Diagnosis: Kidney/Testicular Cancer or Thyroid disease?', type: 'select', options: ['Yes', 'No'] },
            { id: 'pfas_emp', q: 'Does employer have exposure records?', type: 'select', options: ['Yes', 'No', 'Unsure'] }
        ],
        'MILITARY': [
            { id: 'clj_p1', q: 'Timeline: Dates stationed at Camp Lejeune', type: 'text' },
            { id: 'clj_p3', q: 'Condition: Confirmed Parkinson\'s or Cancer?', type: 'select', options: ['Yes', 'No'] }
        ],
        'OTHER': [
            { id: 'gen_p1', q: 'Product Name: Name of product', type: 'text' },
            { id: 'gen_p2', q: 'Manufacturer: Manufacturer (if known)', type: 'text' }
        ]
    };

    function renderQuestionSet(questions, targetId) {
        const container = document.getElementById(targetId);
        if (!container) return;
        container.innerHTML = "";
        questions.forEach(item => {
            const wrapper = document.createElement('div');
            wrapper.className = "niche-question-block";
            let inputHtml = '';
            if (item.type === 'select') {
                inputHtml = `<select class="dynamic-answer" data-qid="${item.id}" data-qtext="${item.q}">
                    ${item.options.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
                </select>`;
            } else {
                inputHtml = `<input type="text" class="dynamic-answer" data-qid="${item.id}" data-qtext="${item.q}" placeholder="${item.placeholder || ''}">`;
            }
            wrapper.innerHTML = `<label class="niche-label">${item.q}</label>${inputHtml}`;
            container.appendChild(wrapper);
        });
    }

    function generateDynamicQuestions() {
        const selectedType = document.getElementById('case_type').value;
        if (litigationQuestions[selectedType]) {
            renderQuestionSet(litigationQuestions[selectedType], 'dynamic-questions-container');
            renderQuestionSet(universalQualifiers, 'universal-questions-container');
            return true;
        }
        return false;
    }

    function validateAndNext(current, target) {
        if (current === 1) {
            if (!document.getElementById('first_name').value || !document.getElementById('consent_checkbox').checked) {
                alert("Please complete name, email, and provide your express consent."); return;
            }
        }
        if (current === 2) {
            if (!document.getElementById('case_type').value) { alert("Please select a Case Category."); return; }
            generateDynamicQuestions();
        }
        next(target);
    }

    function next(s) {
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById('step' + s).classList.add('active');
        document.getElementById('fill').style.width = (s * 25) + '%';
        window.scrollTo(0,0);
        if (s === 4) setTimeout(resizeCanvas, 150);
    }

    async function submit() {
        if (signaturePad.isEmpty()) { alert("Digital Signature Required."); return; }
        const btn = document.getElementById('submit-btn');
        btn.innerText = "Securing Audit Data..."; btn.disabled = true;
        
        const dynamicData = {};
        document.querySelectorAll('.dynamic-answer').forEach(el => {
            dynamicData[el.getAttribute('data-qtext')] = el.value;
        });
        
        const payload = {
            first_name: document.getElementById('first_name').value,
            last_name: document.getElementById('last_name').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            zip_code: document.getElementById('zip_code').value,
            case_type: document.getElementById('case_type').value,
            audit_metadata: dynamicData,
            pathology_impression: document.getElementById('pathology').value,
            signature_base64: signaturePad.toDataURL(),
            apollo_form_id: document.getElementById('apollo_form_id').value,
            submitted_at: new Date().toISOString()
        };
        
        try {
            const { error } = await _supabase.from('settlement_assets').insert([payload]);
            if (error) throw error;
            alert("AUDIT SECURED AND TRANSMITTED."); 
            location.reload();
        } catch (err) {
            alert("Submission Error: " + err.message); 
            btn.disabled = false; btn.innerText = "Submit Final Audit";
        }
    }
</script>
