<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextGen Leadlogic | Universal Settlement Audit</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <style>
        :root { --primary: #0a2540; --accent: #00d4ff; --text: #424770; }
        body { font-family: 'Inter', sans-serif; background: #f6f9fc; display: flex; justify-content: center; padding: 40px 20px; color: var(--text); }
        #audit-container { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 50px 100px -20px rgba(50,50,93,0.25); max-width: 650px; width: 100%; border-top: 10px solid var(--primary); }
        .step { display: none; }
        .step.active { display: block; }
        .progress-bar { height: 6px; background: #e6ebf1; margin-bottom: 30px; border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent); width: 25%; transition: 0.4s; }
        h2 { color: var(--primary); font-size: 22px; margin-bottom: 5px; }
        label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 11px; text-transform: uppercase; color: #8898aa; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #e6ebf1; border-radius: 4px; font-size: 16px; margin-bottom: 20px; box-sizing: border-box; }
        input:focus, select:focus { border-color: var(--accent); outline: none; }
        .btn-row { display: flex; justify-content: space-between; margin-top: 20px; }
        button { padding: 15px 30px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-next { background: var(--primary); color: white; width: 100%; }
        .btn-next:hover { background: #153e63; }
        .btn-back { background: #e6ebf1; color: var(--text); padding: 15px 20px; }
        #signature-pad { border: 2px dashed #e6ebf1; width: 100%; height: 180px; border-radius: 8px; background: #fff; cursor: crosshair; }
        .compliance-text { font-size: 10px; color: #6b7c93; line-height: 1.5; margin-top: 15px; }
        .checkbox-row { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 20px; }
        .checkbox-row input { width: auto; margin: 0; margin-top: 3px; }
        .niche-question-block { background: #f8fafd; border: 1px solid #e6ebf1; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .niche-label { text-transform: none; color: var(--primary); font-size: 14px; margin-bottom: 8px; font-weight: 600; }
    </style>
</head>
<body>

<div id="audit-container">
    <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>

    <!-- STEP 1 -->
    <div class="step active" data-step="1">
        <h2>Claimant Verification</h2>
        <p>Step 1: Legal Identity & Federal Lien Audit</p>
        <label>Full Legal Name</label>
        <div style="display:flex; gap:10px; margin-bottom: 20px;">
            <input type="text" id="first_name" placeholder="First Name" required>
            <input type="text" id="last_name" placeholder="Last Name" required>
        </div>
        <label>E-mail Address</label>
        <input type="email" id="email" placeholder="email@example.com" required>
        <label>Phone Number</label>
        <input type="tel" id="phone" placeholder="(555) 000-0000" required>
        <div class="checkbox-row">
            <input type="checkbox" id="consent_checkbox">
            <div class="compliance-text">I hereby expressly consent to receive automated communications.</div>
        </div>
        <button class="btn-next" onclick="validateAndNext(1, 2)">Continue to Case Selection</button>
    </div>

    <!-- STEP 2 -->
    <div class="step" data-step="2">
        <h2>Litigation Discovery</h2>
        <p>Step 2: Select Your Primary Claim Area</p>
        <label>Case Category</label>
        <select id="case_type">
            <option value="">-- Select Your Injury Group --</option>
            <option value="DJI">Deep Joint Infection (DJI)</option>
            <option value="OZEMPIC">GLP-1 Agonists (Ozempic/Wegovy)</option>
            <option value="TALCUM">Talcum Powder</option>
            <option value="TOXIC_EXPOSURE">Toxic Exposure (AFFF/PFAS)</option>
            <option value="MILITARY">Military (Camp Lejeune)</option>
        </select>
        <div class="btn-row">
            <button class="btn-back" onclick="goToStep(1)">Back</button>
            <button class="btn-next" style="width:70%" onclick="validateAndNext(2, 3)">Next: Clinical Details</button>
        </div>
    </div>

    <!-- STEP 3 -->
    <div class="step" data-step="3">
        <h2>Clinical Audit</h2>
        <p>Step 3: Verbatim Evidence Capture</p>
        <div id="dynamic-questions-container"></div>
        <label>Medical Evidence / Pathology Impression</label>
        <textarea id="pathology" rows="4" placeholder="Enter clinical notes..."></textarea>
        <div class="btn-row">
            <button class="btn-back" onclick="goToStep(2)">Back</button>
            <button class="btn-next" style="width:70%" onclick="goToStep(4)">Final Certification</button>
        </div>
    </div>

    <!-- STEP 4 -->
    <div class="step" data-step="4">
        <h2>Legal Execution</h2>
        <p>Step 4: Digital Signature</p>
        <canvas id="signature-pad"></canvas>
        <div class="btn-row">
            <button class="btn-back" onclick="goToStep(3)">Back</button>
            <button class="btn-next" id="submit-btn" style="width:70%; background:#00d4ff;" onclick="submit()">Submit Audit</button>
        </div>
    </div>
</div>

<script>
    const litigationQuestions = {
        'DJI': [{ id: 'dji_1', q: 'Did you undergo surgery using a DJI implant?' }, { id: 'dji_2', q: 'Was a revision surgery required?' }],
        'OZEMPIC': [{ id: 'oz_1', q: 'Used for at least 6 months?' }, { id: 'oz_2', q: 'Diagnosed with Gastroparesis?' }],
        'TALCUM': [{ id: 'tc_1', q: 'Used daily for over 5 years?' }, { id: 'tc_2', q: 'Diagnosed with Ovarian Cancer?' }],
        'TOXIC_EXPOSURE': [{ id: 'tx_1', q: 'Exposed to AFFF/Firefighting foam?' }],
        'MILITARY': [{ id: 'clj_1', q: 'At Camp Lejeune for 30+ days (1953-1987)?' }]
    };

    function goToStep(stepNumber) {
        console.log("Attempting to move to step:", stepNumber);
        const allSteps = document.querySelectorAll('.step');
        let found = false;

        allSteps.forEach(s => {
            s.classList.remove('active');
            if (parseInt(s.getAttribute('data-step')) === stepNumber) {
                s.classList.add('active');
                found = true;
            }
        });

        if (found) {
            document.getElementById('fill').style.width = (stepNumber * 25) + '%';
            window.scrollTo(0,0);
        } else {
            console.error("Critical Error: Step " + stepNumber + " not found in HTML.");
        }
    }

    function generateDynamicQuestions() {
        const type = document.getElementById('case_type').value;
        const container = document.getElementById('dynamic-questions-container');
        container.innerHTML = "";
        
        if (litigationQuestions[type]) {
            litigationQuestions[type].forEach(item => {
                const div = document.createElement('div');
                div.className = "niche-question-block";
                div.innerHTML = `<label class="niche-label">${item.q}</label>
                                 <select class="dynamic-answer" data-qid="${item.id}" data-qtext="${item.q}">
                                    <option value="Yes">Yes</option><option value="No">No</option>
                                 </select>`;
                container.appendChild(div);
            });
        }
    }

    function validateAndNext(current, target) {
        if (current === 1) {
            if (!document.getElementById('first_name').value || !document.getElementById('consent_checkbox').checked) {
                alert("Please complete required fields and consent."); return;
            }
        }
        if (current === 2) {
            if (!document.getElementById('case_type').value) {
                alert("Please select a case."); return;
            }
            generateDynamicQuestions();
        }
        goToStep(target);
    }

    // Initialize Signature Pad
    const canvas = document.getElementById('signature-pad');
    const signaturePad = new SignaturePad(canvas);
    function resize() {
        const ratio = Math.max(window.devicePixelRatio || 1, 1);
        canvas.width = canvas.offsetWidth * ratio; canvas.height = canvas.offsetHeight * ratio;
        canvas.getContext("2d").scale(ratio, ratio);
    }
    window.onresize = resize; resize();

    async function submit() {
        alert("Logic Check: Ready to Send to Supabase.");
        // Add your Supabase logic here
    }
</script>
</body>
</html>
